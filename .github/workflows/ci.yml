name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  generated-code:
    name: Check Generated Code
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: vapor/swiftly-action@v0.2.1
      with:
        toolchain: "6.3"
    - name: Regenerate and check sources
      run: bash scripts/check-generated-code.sh
  build-apple:
    name: Build and Test (macOS)
    runs-on: xcode-27
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Print Xcode & Swift Version
      run: |
        xcodebuild -version
        swift --version
    - name: Build & Test
      run: swift test -v --enable-code-coverage --xunit-output .build/test-results.xml
    - name: Test Maintainer Tools
      run: swift test -v --package-path Tools --enable-code-coverage
    - name: Generate LCOV coverage reports
      id: coverage
      run: |
        # SwiftPM's exported JSON uploads, but Codecov marks it unusable.
        # Swift Build produces an XCTest bundle per test target and one merged profile.
        export_lcov() {
          local package_path="$1" report_path="$2"
          local coverage_json codecov_dir test_bundle test_binary
          local -a objects=()
          coverage_json="$(swift test --package-path "$package_path" --skip-build --show-codecov-path --enable-code-coverage)"
          codecov_dir="$(dirname "$coverage_json")"
          for test_bundle in "$codecov_dir"/../*.xctest; do
            test_binary="$test_bundle/Contents/MacOS/$(basename "$test_bundle" .xctest)"
            test -f "$test_binary" || continue
            objects+=(-object "$test_binary")
          done
          if ! test -f "$codecov_dir/default.profdata" || [ "${#objects[@]}" -eq 0 ]; then
            echo "Missing coverage profile or test binaries for $package_path" >&2
            return 1
          fi
          xcrun llvm-cov export -format=lcov -instr-profile "$codecov_dir/default.profdata" "${objects[@]}" > "$report_path"
          test -s "$report_path"
        }

        export_lcov . .build/codecov-runtime.lcov
        export_lcov Tools Tools/.build/codecov-tools.lcov
        echo "runtime=.build/codecov-runtime.lcov" >> "$GITHUB_OUTPUT"
        echo "tools=Tools/.build/codecov-tools.lcov" >> "$GITHUB_OUTPUT"
    - name: Resolve test results report path
      id: test_results
      run: |
        test_results_path="$(find .build -type f -name 'test-results*.xml' | head -n 1)"
        test -n "$test_results_path"
        test -f "$test_results_path"
        echo "path=$test_results_path" >> "$GITHUB_OUTPUT"
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ steps.coverage.outputs.runtime }},${{ steps.coverage.outputs.tools }}
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ steps.test_results.outputs.path }}
        report_type: test_results
  build-apple-minimum:
    name: Build and Test (Xcode 16)
    runs-on: macos-15
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Print Xcode & Swift Version
      run: |
        xcodebuild -version
        swift --version
    - name: Test Runtime Package
      run: swift test -v
    - name: Test Maintainer Tools
      run: swift test -v --package-path Tools
  build-linux:
    name: Build and Test (Linux) - Swift ${{ matrix.swift }}
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    permissions:
      contents: read
    strategy:
      matrix:
        swift: ["6.0", "6.1", "6.2", "6.3", "6.4"]
        include:
          - swift: "6.4"
            os: ubuntu-26.04
    steps:
    - uses: vapor/swiftly-action@v0.2.1
      with:
        toolchain: ${{ matrix.swift }}
        continue-on-error: true
    - name: Retry Swift toolchain installation
      if: failure()
      uses: vapor/swiftly-action@v0.2.1
      with:
        toolchain: ${{ matrix.swift }}
    - uses: actions/checkout@v7.0.1
    - name: Test
      run: swift test -v
    - name: Test Maintainer Tools
      run: swift test -v --package-path Tools
  build-android:
    name: Build and Test (Android) - Swift 6.4
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Free disk space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - uses: skiptools/swift-android-action@v2.9.5
      with:
        swift-version: "6.4.2"
        ndk-version: "30"
        # The action only stages .resources automatically. Swift Build emits .bundle.
        copy-files: .build/out/Products/Debug-android-x86_64/*.bundle
